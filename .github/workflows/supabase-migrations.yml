name: Supabase Migrations (Youth Republic)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify migrations without applying)'
        required: false
        default: false
        type: boolean

concurrency:
  group: yr-supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Files Integrity
        run: |
          echo "=== Verifying Youth Republic Migration Files ==="
          ls -la backend/supabase/migrations/
          for f in backend/supabase/migrations/*.sql; do
            echo "Checking: $f"
            if [ ! -s "$f" ]; then
              echo "Error: Migration $f is empty!"
              exit 1
            fi
          done
          echo "All migration files verified."

  deploy:
    name: Apply Migrations to Production
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'kbotpktgojpvkotigrjh' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Applying migrations via direct database connection URL..."
            supabase db push --workdir backend --db-url "$SUPABASE_DB_URL" --include-all
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Applying migrations via Supabase project link..."
            supabase link --workdir backend --project-ref "$SUPABASE_PROJECT_REF"
            supabase db push --workdir backend --password "$SUPABASE_DB_PASSWORD" --include-all
          else
            echo "::error::Missing database credentials in GitHub Secrets. Please configure either SUPABASE_DB_URL or both SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in repository secrets."
            exit 1
          fi

  dry-run:
    name: Dry Run Migrations
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dry Run Deploy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'kbotpktgojpvkotigrjh' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Running dry-run migration check via direct DB URL..."
            supabase db push --workdir backend --db-url "$SUPABASE_DB_URL" --dry-run
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Running dry-run migration check via Supabase project link..."
            supabase link --workdir backend --project-ref "$SUPABASE_PROJECT_REF"
            supabase db push --workdir backend --password "$SUPABASE_DB_PASSWORD" --dry-run
          else
            echo "::error::Missing database credentials in GitHub Secrets."
            exit 1
          fi

  deploy-functions:
    name: Deploy Edge Functions to Production
    needs: deploy
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'kbotpktgojpvkotigrjh' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not set. Edge Functions stay on the previously deployed code until that secret exists. Add it in repository secrets, then re-run this workflow."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is empty."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          deployed=0
          for dir in backend/supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ] || [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            echo "Deploying ${name}"
            supabase functions deploy "$name" \
              --workdir backend \
              --import-map supabase/deno.jsonc \
              --yes \
              --remote="$SUPABASE_PROJECT_REF"
            deployed=$((deployed + 1))
          done
          if [ "$deployed" -eq 0 ]; then
            echo "::error::No Edge Functions found under backend/supabase/functions."
            exit 1
          fi
          echo "Deployed ${deployed} Edge Functions to ${SUPABASE_PROJECT_REF}"
