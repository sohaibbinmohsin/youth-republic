name: Supabase Migrations (Youth Republic)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify migrations without applying)'
        required: false
        default: false
        type: boolean

concurrency:
  group: yr-supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Verify Migration Files Integrity
        run: |
          echo "=== Verifying Youth Republic Migration Files ==="
          ls -la backend/supabase/migrations/
          for f in backend/supabase/migrations/*.sql; do
            echo "Checking: $f"
            if [ ! -s "$f" ]; then
              echo "Error: Migration $f is empty!"
              exit 1
            fi
          done
          echo "All migration files verified."

  deploy:
    name: Apply Migrations to Production
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Deploy Migrations
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it in repository secrets to apply migrations via the Supabase Management API (no direct database host connection from Actions)."
            exit 1
          fi
          if [ -z "$SUPABASE_POOLER_URL" ]; then
            echo "::error::GitHub Actions secret SUPABASE_POOLER_URL is not set. The session pooler connection string is required to apply migrations from GitHub Actions over IPv4."
            exit 1
          fi
          echo "Applying migrations via Supabase session pooler..."
          supabase db push --workdir backend --remote="$SUPABASE_POOLER_URL" --include-all --yes

  dry-run:
    name: Dry Run Migrations
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Dry Run Deploy
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it in repository secrets to verify migrations via the Supabase Management API."
            exit 1
          fi
          if [ -z "$SUPABASE_POOLER_URL" ]; then
            echo "::error::GitHub Actions secret SUPABASE_POOLER_URL is not set. The session pooler connection string is required to verify migrations from GitHub Actions over IPv4."
            exit 1
          fi
          echo "Running dry-run migration check via Supabase session pooler..."
          supabase db push --workdir backend --remote="$SUPABASE_POOLER_URL" --include-all --yes --dry-run

  deploy-functions:
    name: Deploy Edge Functions to Production
    needs: deploy
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'kbotpktgojpvkotigrjh' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not set. Edge Functions stay on the previously deployed code until that secret exists. Add it in repository secrets, then re-run this workflow."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is empty."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          deployed=0
          for dir in backend/supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ] || [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            echo "Deploying ${name}"
            supabase functions deploy "$name" \
              --workdir backend \
              --import-map supabase/deno.jsonc \
              --yes \
              --remote="$SUPABASE_PROJECT_REF"
            deployed=$((deployed + 1))
          done
          if [ "$deployed" -eq 0 ]; then
            echo "::error::No Edge Functions found under backend/supabase/functions."
            exit 1
          fi
          echo "Deployed ${deployed} Edge Functions to ${SUPABASE_PROJECT_REF}"
